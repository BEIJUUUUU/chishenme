name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: 校验内置数据文件已随仓库分发
        # 曾经因为 .gitignore 里写了 "data/" 把 app/data/ 一起忽略，
        # 仓库看着正常、跑起来却没有一道菜。这一步专门防这个回归。
        run: |
          for f in app/data/dishes.json app/data/howto.json app/data/seasonal.json; do
            test -s "$f" || { echo "缺少 $f —— 检查 .gitignore 是不是误伤了 app/data/"; exit 1; }
          done
          echo "内置菜谱 $(grep -c '"name"' app/data/dishes.json) 道"

      - name: 代码检查
        run: ruff check app tests scripts run.py

      - name: 运行测试
        run: pytest -q

      - name: 离线流程自检
        run: python scripts/offline_demo.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t chishenme:ci .

      - name: 启动并健康检查
        run: |
          docker run -d --name csm -p 8080:8080 \
            -e CSM_SECRET_KEY=ci-secret \
            chishenme:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo "健康检查通过"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker logs csm

      - name: 清理
        if: always()
        run: docker rm -f csm || true
