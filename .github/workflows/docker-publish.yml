name: Docker 镜像发布

# 推 main 就构建 latest；打 v1.2.3 这种 tag 就同时构建版本号；也可以手动触发
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR 的镜像名必须全小写 —— 账号名是大写 BEIJUUUUU，所以这里写死
  IMAGE: ghcr.io/beijuuuuu/chishenme

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # NAS 有很多是 ARM（群晖/威联通/树莓派），所以必须出多架构镜像，
      # 否则用户 pull 下来会报 "no matching manifest"
      - name: 启用 QEMU（构建 ARM 镜像用）
        uses: docker/setup-qemu-action@v3

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 提示如何让镜像可被匿名拉取
        run: |
          echo "镜像已推送：${{ env.IMAGE }}"
          echo "如果这是第一次发布，请到 https://github.com/users/${{ github.repository_owner }}/packages/container/chishenme/settings"
          echo "把 Package visibility 改成 Public，否则别人 docker pull 会 401。"
