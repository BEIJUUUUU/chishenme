[project]
name = "chishenme"
version = "0.1.0"
description = "吃什么？—— 每天自动生成中晚餐菜谱并推送到微信的家庭菜单机器人"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "吃什么 contributors" }]
keywords = ["menu", "recipe", "llm", "wechat", "nas", "self-hosted"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/BEIJUUUUU/chishenme"
Repository = "https://github.com/BEIJUUUUU/chishenme"
Issues = "https://github.com/BEIJUUUUU/chishenme/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ISC"]
# 说明：
# B008 FastAPI 的 Depends(...) 就是「默认参数里调用函数」，这是框架约定
# BLE001/S110 通知通道与调度器需要吞掉任意异常，绝不能因为一个推送失败炸掉定时任务
# DTZ005/DTZ011 家用场景按本地时区（容器 TZ）计算，刻意不引入 UTC 心智负担
# RUF001/2/3 本项目是中文项目，全角标点（，：？）是有意为之
ignore = [
    "E501", "B008", "BLE001", "S110", "DTZ005", "DTZ011", "RUF012",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "ISC004", "I001"]
"scripts/*" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = ["ignore::DeprecationWarning"]
