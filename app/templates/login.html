{% extends "base.html" %}
{% block title %}登录 · {{ app_name }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1 class="login-title">🍚 {{ app_name }}</h1>
    <p class="muted">每天自动生成中晚餐菜单，推送到家人微信</p>

    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

    <form method="post" action="/login" class="stack">
      <div class="field">
        <label for="username">账号</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>

    <p class="muted small">首次部署的默认账号是 <code>admin / admin123</code>，登录后请立刻在「设置」里改掉。</p>
    <p class="muted small">不想每次登录？登录后在「设置 → 🔓 访问控制」把访问方式改成「免登录」即可——只建议在家庭局域网内这样用。</p>
  </div>
</div>
{% endblock %}
